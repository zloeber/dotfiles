[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[tools]
go = "1.26.4"
fzf = "latest"
node = "22"
chezmoi = "latest"
terraformer = "latest"
rust = "latest"
uv = "latest"
python = "3.13"
glab = "latest"
"npm:semantic-release" = "latest"
"npm:@google/gemini-cli" = "latest"
glow = "latest"
fx = "latest"
npm = "latest"
task = "latest"
"npm:mcp-searxng" = "latest"
ansible = "latest"
ruby = "4.0.5"
ripgrep = "latest"
usage = "latest"
dive = "latest"
pnpm = "latest"
"github:docker/cagent" = "latest"
helm = "latest"
age = "latest"
# github backend: the default aqua-backed `delta` installs but doesn't expose
# its bin on PATH in current mise, which silently breaks `chezmoi diff`.
"github:dandavison/delta" = "latest"
colima = "latest"
java = "temurin-17"
kotlin = { version = "latest", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
"pipx:copier" = "9.16.0"
gh = "latest"
terraform = "1.14.8"
tflint = "0.63.1"
tirith = "0.3.2"
opencode = "latest"
starship = "latest"
"npm:skills" = "1.5.11"
yq = "latest"
"cargo:croft" = "latest"
azure = { version = "latest", uvx_args = "--prerelease=allow" }
awscli = { version = "latest", symlink_bins = "true" }
"pipx:cheznav" = "latest"
"cargo:clin-rs" = "latest"
"npm:latest" = "latest"
"npm:@tobilu/qmd" = "2.5.3"
tfsec = "1.28.14"
"github:zloeber/pinner" = "0.6.0"
"github:kenn-io/agentsview" = "latest"

