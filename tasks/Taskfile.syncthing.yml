# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Syncthing helpers (cross-platform). Included from the root Taskfile as the
# `syncthing:` namespace. The declarative spec lives in the chezmoi source at
# .chezmoidata/syncthing.json and is reconciled by the standalone, out-of-band
# ../syncthing-setup.sh (NOT by `chezmoi apply`).

version: "3"
silent: true

vars:
  SETUP:
    sh: echo "{{.ROOT_DIR}}/syncthing-setup.sh"
  SPEC_SRC:
    sh: echo "$(chezmoi source-path 2>/dev/null)/.chezmoidata/syncthing.json"

tasks:
  install:
    desc: "Install the Syncthing binary (cross-platform), without touching config"
    cmds:
      - "{{.SETUP}} --install-only"

  apply:
    desc: "Install (if needed) + start Syncthing, then reconcile devices/folders from the spec"
    cmds:
      - "{{.SETUP}}"

  edit:
    desc: "Edit the declarative Syncthing spec (.chezmoidata/syncthing.json)"
    cmds:
      - ${EDITOR:-vi} "{{.SPEC_SRC}}"

  id:
    desc: "Print THIS machine's Syncthing device ID (share it with peers)"
    cmds:
      - |
        if command -v syncthing >/dev/null 2>&1; then
          syncthing --device-id
        else
          echo "syncthing not installed. Run: task syncthing:install"; exit 1
        fi

  gui:
    desc: "Open the Syncthing web UI"
    cmds:
      - |
        if [ "{{OS}}" = "darwin" ]; then
          open http://127.0.0.1:8384
        else
          xdg-open http://127.0.0.1:8384
        fi
