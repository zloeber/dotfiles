# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Taskfile for this chezmoi-backed dotfiles repo.
# Run `task` (no arguments) to list every available command.
#
# Most tasks accept extra chezmoi arguments after `--`, e.g.:
#   task diff -- ~/.zshrc
#   task edit -- ~/.config/mise/config.toml
#   task add  -- ~/.config/newtool/config.yml

version: "3"
silent: true

vars:
  # Tools that must be present for this repo to work end to end.
  REQUIRED_BINS: "git mise chezmoi age delta task"
  # Cross-platform "open" (macOS: open, Linux: xdg-open).
  OPEN:
    sh: 'if [ "{{OS}}" = "darwin" ]; then echo open; else echo xdg-open; fi'

includes:
  github:
    taskfile: ./tasks/Taskfile.github.yml
    optional: true

tasks:
  default:
    cmds:
      - task -l --sort none

  # ---------------------------------------------------------------------
  # Setup
  # ---------------------------------------------------------------------
  bootstrap:
    desc: "Fresh-machine setup: install mise + required tools, then run doctor"
    cmds:
      - ./configure.sh
      - task: doctor

  deps:
    desc: Install/update the tool versions pinned in mise.toml
    cmds:
      - mise install -y

  doctor:
    desc: Verify required binaries are present and run `chezmoi doctor`
    cmds:
      - |
        echo "==> Required binaries"
        missing=0
        for bin in {{.REQUIRED_BINS}}; do
          if command -v "$bin" >/dev/null 2>&1; then
            printf '  [ok]      %-9s %s\n' "$bin" "$(command -v "$bin")"
          else
            printf '  [MISSING] %-9s\n' "$bin"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo
          echo "  -> Install missing tools with: task bootstrap  (or: mise install)"
        fi
        echo
        if command -v chezmoi >/dev/null 2>&1; then
          echo "==> chezmoi doctor"
          chezmoi doctor || true
        fi

  # ---------------------------------------------------------------------
  # Everyday chezmoi operations
  # ---------------------------------------------------------------------
  diff:
    desc: "Show what `chezmoi apply` would change (task diff -- [target])"
    cmds:
      - chezmoi diff {{.CLI_ARGS}}

  status:
    desc: Show which managed targets differ from the source
    cmds:
      - chezmoi status

  apply:
    desc: "Apply the source to your home directory (task apply -- [target])"
    cmds:
      - chezmoi apply --verbose {{.CLI_ARGS}}

  update:
    desc: "Capture live edits from $HOME back into the source (chezmoi re-add)"
    cmds:
      - chezmoi re-add {{.CLI_ARGS}}

  edit:
    desc: "Edit a managed file via chezmoi (task edit -- ~/.zshrc)"
    cmds:
      - chezmoi edit {{.CLI_ARGS}}

  add:
    desc: "Start managing a new file (task add -- ~/.config/foo/bar.toml)"
    cmds:
      - chezmoi add {{.CLI_ARGS}}

  cd:
    desc: "Print the chezmoi source path (use: cd \"$(task cd)\")"
    cmds:
      - chezmoi source-path

  # ---------------------------------------------------------------------
  # Syncing with git
  # ---------------------------------------------------------------------
  pull:
    desc: Pull the latest source from git and apply it (chezmoi update)
    cmds:
      - chezmoi update {{.CLI_ARGS}}

  save:
    desc: "Commit & push source changes to git (task save -- \"commit message\")"
    cmds:
      - |
        msg="{{.CLI_ARGS}}"
        [ -n "$msg" ] || msg="chore: update dotfiles"
        git add -A
        if git diff --cached --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "$msg"
        fi
        git push

  # ---------------------------------------------------------------------
  # Secrets / age key
  # ---------------------------------------------------------------------
  key:decrypt:
    desc: Decrypt the chezmoi age identity into ~/.config/chezmoi/key.txt
    cmds:
      - |
        mkdir -p "$HOME/.config/chezmoi"
        chezmoi age decrypt \
          --output "$HOME/.config/chezmoi/key.txt" \
          --passphrase "$(chezmoi source-path)/key.txt.age"
        chmod 600 "$HOME/.config/chezmoi/key.txt"
        echo "Wrote $HOME/.config/chezmoi/key.txt"
    status:
      - test -f "$HOME/.config/chezmoi/key.txt"

  secret:search:
    desc: Scan the repo (and git history) for leaked secrets with gitleaks
    cmds:
      - gitleaks detect --source ./ -f json -r secret_results.json

  # ---------------------------------------------------------------------
  # Housekeeping
  # ---------------------------------------------------------------------
  show:
    desc: Show environment / chezmoi paths
    cmds:
      - |
        echo "OS:           {{OS}}"
        echo "ARCH:         {{ARCH}}"
        echo "ROOT_DIR:     {{.ROOT_DIR}}"
        echo "OPEN:         {{.OPEN}}"
        if command -v chezmoi >/dev/null 2>&1; then
          echo "SOURCE_PATH:  $(chezmoi source-path 2>/dev/null)"
        fi

  clean:
    desc: Remove local scratch files (.DS_Store, secret scan output)
    cmds:
      - find . -type f -name ".DS_Store" -delete
      - rm -f secret_results.json
